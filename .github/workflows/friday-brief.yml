name: Friday Brief Auto-Update

# NOTE: The weekly cron schedule is intentionally disabled.
# This Action authenticates via ANTHROPIC_API_KEY (Tier 1), and Claude Code's
# startup context exceeds the 10K-input-tokens/min org rate limit on the first
# request, so every scheduled run 429'd before doing any work (failed every
# Friday since ~April 2026). The weekly auto-update now runs as a free,
# subscription-authed Claude Code Routine instead. This workflow is kept for
# manual (workflow_dispatch) runs only.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write

jobs:
  update-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Friday brief update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p --dangerously-skip-permissions "$(cat .github/friday-brief-prompt.txt)"

      - name: Commit and push changes
        run: |
          git config user.name "Friday Brief Bot"
          git config user.email "actions@github.com"
          git add friday-finance-data.js tenant-lender-data.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Friday Brief $(date +'%B %d, %Y')"
            git push origin main
          fi
